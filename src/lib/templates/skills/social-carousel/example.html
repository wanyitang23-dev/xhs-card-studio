<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>不是背两个 loss — 科技三联</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Without this a 1080-wide card with padding measures wider than 1080 and the
     3:4 ratio Xiaohongshu expects comes out as 0.755. */
  * { box-sizing:border-box; }
  /* Declared, not inherited: this file loads no CSS framework, and a generated
     card gets exactly this from BASE_RESET. */
  body { margin:0; line-height:1.5; background:#05070a; font-family:'Noto Sans SC',-apple-system,sans-serif; padding:36px 0; -webkit-font-smoothing:antialiased; }

  :root {
    --void:   #05070a;   /* page behind the cards */
    --ink:    #0a0e14;   /* card base, near-black, cool */
    --ink-2:  #0f1520;
    --line:   rgba(148,180,214,0.14);
    /* Three tiers, all solid. An earlier version gave only --text and a 0.52
       alpha --mute, so body copy had no token of its own: a generated deck
       invented a third value (0.8 alpha) and ended up with two brightnesses of
       body text on one card, which reads as the dimmer one being broken.
       Contrast over the card base #0a0e14: 16.6 / 14.4 / 7.3. */
    --text:   #e8eef6;   /* 标题、强调 */
    --body:   #d6dfea;   /* 正文 —— 成段的中文一律用这个 */
    --mute:   #94a0b2;   /* 只给 22px 以下的等宽小字: 页码、标签、水印 */
    --cyan:   #22d3ee;
    --blue:   #4d7cff;
    --violet: #a78bfa;
    --mono:   'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
  }

  .deck { display:flex; flex-direction:column; align-items:center; gap:24px; }

  .card {
    width:1080px; height:1440px; flex:0 0 auto;
    border-radius:32px; overflow:hidden; position:relative;
    padding:88px 72px; display:flex; flex-direction:column;
    background:var(--ink); color:var(--text);
    border:1px solid var(--line);
  }

  /* Hairline engineering grid. Masked so it reads as texture, not as a table. */
  .grid {
    position:absolute; inset:0; pointer-events:none;
    background-image:
      repeating-linear-gradient(90deg, rgba(148,180,214,0.055) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(0deg,  rgba(148,180,214,0.055) 0 1px, transparent 1px 72px);
    -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 40%, #000 0%, transparent 78%);
            mask-image:radial-gradient(ellipse 70% 55% at 50% 40%, #000 0%, transparent 78%);
  }
  /* Single light source per card, hue advances across the three. */
  .glow { position:absolute; width:900px; height:900px; border-radius:50%; filter:blur(120px); opacity:0.30; pointer-events:none; }
  .c1 .glow { background:var(--cyan);   top:-280px; right:-220px; }
  .c2 .glow { background:var(--blue);   top:180px;  left:-320px; }
  .c3 .glow { background:var(--violet); bottom:-300px; right:-180px; opacity:0.34; }

  /* Concentric rings — a radar/telemetry motif, not decoration for its own sake. */
  .rings { position:absolute; width:760px; height:760px; right:-200px; top:300px; pointer-events:none; opacity:0.5; }
  .rings span { position:absolute; inset:0; border:1px solid var(--line); border-radius:50%; }
  .rings span:nth-child(2) { inset:110px; }
  .rings span:nth-child(3) { inset:220px; border-color:rgba(34,211,238,0.22); }

  .top { position:relative; display:flex; justify-content:space-between; align-items:center; }
  .brand { display:flex; align-items:center; gap:14px; }
  .mark {
    width:44px; height:44px; border-radius:12px; display:grid; place-items:center;
    font-family:var(--mono); font-size:15px; font-weight:700; color:#05070a;
    background:linear-gradient(140deg, var(--cyan), var(--blue));
  }
  .brand .name { font-size:26px; font-weight:700; letter-spacing:0.01em; }
  .index {
    font-family:var(--mono); font-size:20px; font-weight:500; letter-spacing:0.22em;
    color:var(--mute); padding:10px 18px; border:1px solid var(--line); border-radius:8px;
  }

  .lockup { position:relative; margin:auto 0; }
  .kicker {
    display:inline-flex; align-items:center; gap:10px;
    font-family:var(--mono); font-size:20px; font-weight:500; letter-spacing:0.2em;
    color:var(--cyan); text-transform:uppercase; margin-bottom:36px;
  }
  .kicker::before { content:''; width:32px; height:1px; background:var(--cyan); }

  h2 { font-size:128px; font-weight:900; line-height:1.06; letter-spacing:-0.035em; margin:0; }
  h2 .on {
    background:linear-gradient(100deg, var(--cyan), var(--blue) 60%, var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  /* Body copy, so --body and weight 500: at weight 400 a CJK glyph on a
     near-black ground renders too thin to hold its strokes. */
  .sub { margin-top:40px; font-size:30px; font-weight:500; line-height:1.6; color:var(--body); max-width:22ch; }

  /* Progress rail — the "1 of 3" state, readable without counting cards. */
  .rail { position:relative; margin-top:auto; height:2px; background:rgba(148,180,214,0.12); border-radius:2px; }
  .rail i { position:absolute; left:0; top:0; height:100%; border-radius:2px; background:linear-gradient(90deg, var(--cyan), var(--blue)); }
  .c1 .rail i { width:33.33%; }
  .c2 .rail i { width:66.66%; }
  .c3 .rail i { width:100%; background:linear-gradient(90deg, var(--cyan), var(--violet)); }

  .foot { position:relative; margin-top:36px; display:flex; justify-content:space-between; align-items:center; }
  .caption { font-family:var(--mono); font-size:20px; letter-spacing:0.16em; color:var(--mute); text-transform:uppercase; }
  .loop { font-family:var(--mono); font-size:20px; letter-spacing:0.2em; color:var(--text); padding:10px 18px; border-radius:8px; border:1px solid rgba(167,139,250,0.5); }
</style>
</head>
<body>
<div class="deck">

  <div class="card c1">
    <div class="glow"></div><div class="grid"></div>
    <div class="rings"><span></span><span></span><span></span></div>
    <div class="top">
      <div class="brand"><span class="mark">RL</span><span class="name">对齐笔记</span></div>
      <div class="index">01 / 03</div>
    </div>
    <div class="lockup">
      <div class="kicker">RLHF · 复习</div>
      <h2>不是背<br><span class="on">两个 loss</span></h2>
      <p class="sub">公式记住了，但一直没真正想明白。</p>
    </div>
    <div class="rail"><i></i></div>
    <div class="foot">
      <div class="caption">PPO &amp; DPO · 01</div>
    </div>
  </div>

  <div class="card c2">
    <div class="glow"></div><div class="grid"></div>
    <div class="top">
      <div class="brand"><span class="mark">RL</span><span class="name">对齐笔记</span></div>
      <div class="index">02 / 03</div>
    </div>
    <div class="lockup">
      <div class="kicker">核心问题</div>
      <h2>而是问<br><span class="on">两个问题</span></h2>
      <p class="sub">它怎么知道一个回答好不好？知道之后，又怎么改模型？</p>
    </div>
    <div class="rail"><i></i></div>
    <div class="foot">
      <div class="caption">A = R − V = 8 − 5 = 3</div>
    </div>
  </div>

  <div class="card c3">
    <div class="glow"></div><div class="grid"></div>
    <div class="rings"><span></span><span></span><span></span></div>
    <div class="top">
      <div class="brand"><span class="mark">RL</span><span class="name">对齐笔记</span></div>
      <div class="index">03 / 03</div>
    </div>
    <div class="lockup">
      <div class="kicker">结论</div>
      <h2>答案<br><span class="on">就两句话</span></h2>
      <p class="sub">PPO：Reward → Advantage → Policy<br>DPO：Preference → Policy</p>
    </div>
    <div class="rail"><i></i></div>
    <div class="foot">
      <div class="caption">@对齐笔记</div>
      <div class="loop">收藏 ↻</div>
    </div>
  </div>

</div>
</body>
</html>
